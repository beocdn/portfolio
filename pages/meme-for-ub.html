<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
	header {

	  top: 0;
	  left: 0;

	  background: #fff;

	  display: flex;
	  justify-content: space-between;
	  align-items: center;
	  padding: 35px 60px;
	  z-index: 1000;
	}

	.logo-fixed {
      position: fixed;
	  top: 10px;
	  left: 20px;
	  width: 90px;
	  height: 90px;
	  margin-left: 40px;
	  z-index: 1001;
	  cursor: pointer;
	}

	header nav {
	  display: flex;
	  align-items: center;
	  margin-right: 120px;
	}

	header nav img {
	  margin-left: 25px;

	.nav-img.about { width: 80px; }

  </style>
</head>
<body>

	<!-- BeoWuld Icon -->
		<a href="home main page.html">
			<img class="logo-fixed" src="../assets/BeoWuld Logo White.png" alt="BeoWuld Logo">
		</a>

	<!-- Top Navigation -->
	<header>
	  <div></div>
	  <nav>
		<a href="home main page.html#about"><img class="nav-img about" src="../assets/About Asset.png" alt="About"></a>
		<a href="home main page.html#branding"><img class="nav-img portfolio" src="../assets/Portfolio Asset.png" alt="Portfolio"></a>
		<a href="home main page.html#services"><img class="nav-img services" src="../assets/Services Asset.png" alt="Services"></a>
		<a href="home main page.html#contact"><img class="nav-img contact" src="../assets/Contact Asset.png" alt="Contact"></a>
	  </nav>
	</header>
	
	<!-- Tiny down arrow under the logo -->
	<a href="home main page.html">
	  <img src="../assets/Back Asset.png" alt="Back to Main"
		   style="position: fixed; top: 110px; left: 10px; width: 90px; height: auto; cursor: pointer; z-index: 1001;">
	</a>

	<!-- Main content -->
	
	<main style="padding-top: 150px; text-align: center; position: relative;">
  <div id="carousel" style="position: relative; display: flex; align-items: center; justify-content: center;">

    <!-- Image -->
    <img id="carouselImage" src="../assets/Meme for UB.jpg"
         alt="Selected Image" style="max-width: 50%; height: auto; display: block;">

  </div>

  <h1 style="font-family: Garamond, serif; font-variant: small-caps; font-weight: bold; font-size: 1.5em; margin-top: 20px;">Meme for UB</h1>
  <p style="font-family: Garamond, serif; font-size: 1.2em; margin: 10px 20px;">Introducing the advertising field I want to be in: meme marketing. I made this one because I had been using some meme templates and thought "Why not extend that to advertise my university?" and thus this meme and some more were born.</p>
</main>


<script>
  const images = [
    "../assets/Meme for UB.jpg",

  ];
  let currentIndex = 0;

  const imageElement = document.getElementById("carouselImage");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  prevBtn.addEventListener("click", () => {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    imageElement.src = images[currentIndex];
  });

  nextBtn.addEventListener("click", () => {
    currentIndex = (currentIndex + 1) % images.length;
    imageElement.src = images[currentIndex];
  });
</script>


</body>
</html>
