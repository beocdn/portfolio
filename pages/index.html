<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BeoWuld - Welcome</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Garamond, serif;
      position: relative;
      cursor: pointer;
    }

    .center-content {
      position: absolute;
      top: 56%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .center-content img {
      display: block;
      margin: 20px auto;
      max-width: 100%;
      height: auto;
    }

    .logo-fixed {
      position: fixed;
      top: 10px;
      left: 20px;
      width: 90px;
      height: 90px;
      margin-left: 40px;
    }
  </style>
</head>
<body onclick="window.location.href='home main page.html'">

  <!-- BeoWuld Icon (clickable throughout the website) -->
  <img class="logo-fixed" src="../assets/BeoWuld Logo White.png" alt="BeoWuld Logo">

  <!-- BeoWuld IntroTextStart and ornament -->
  <div class="center-content">
    <img src="../assets/BeoWuld IntroTextStart.png" alt="BeoWuld Loading Intro">
    <img src="../assets/Loading Ornament.png" alt="Ornament">
  </div>

</body>
</html>
